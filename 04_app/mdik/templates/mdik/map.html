{% extends "mdik/base.html" %}
{% block title %}Peta Sebaran — MDIK{% endblock %}
{% block content %}

<div class="panel" style="margin-bottom:12px">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div>
      <h2 style="margin:0">Peta sebaran event tsunami</h2>
      <div class="subtitle">Hanya event terverifikasi yang ditampilkan untuk publik. Warna menandai kelas bahaya.</div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;color:var(--text-dim)">
      <input type="checkbox" id="toggleAll" style="width:auto"> Tampilkan semua status (perlu login)
    </label>
  </div>
</div>

<div id="map"></div>

<div class="panel" style="margin-top:12px">
  <span class="badge awas">Awas &gt;3 m</span>
  <span class="badge siaga">Siaga 0,5–3 m</span>
  <span class="badge waspada">Waspada ≤0,5 m</span>
  <span class="badge">Tidak diketahui</span>
</div>

<script src="{{ url_for('static', filename='libs/leaflet.js') }}"></script>
<script>
const map = L.map('map').setView([0, 120], 2);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 18
}).addTo(map);

const colors = {'Awas':'#ef4444', 'Siaga':'#f59e0b', 'Waspada':'#38bdf8', 'Tidak diketahui':'#94a3b8'};
let layer;

async function load(all) {
  if (layer) map.removeLayer(layer);
  const res = await fetch('/mdik/api/events.geojson' + (all ? '?all=1' : ''));
  const data = await res.json();
  layer = L.geoJSON(data, {
    pointToLayer: (feature, latlng) => L.circleMarker(latlng, {
      radius: 4, weight: 1, color: colors[feature.properties.risk_level] || '#94a3b8',
      fillColor: colors[feature.properties.risk_level] || '#94a3b8', fillOpacity: .55
    }),
    onEachFeature: (feature, lyr) => {
      const p = feature.properties;
      lyr.bindPopup(`<b>${p.country || ''}</b><br>${p.location || ''}<br>` +
        `Tahun ${p.year} · ${p.risk_level}<br>Tinggi ${p.max_height_m ?? '—'} m<br>` +
        `Status ${p.status}`);
    }
  }).addTo(map);
}
document.getElementById('toggleAll').addEventListener('change', e => load(e.target.checked));
load(false);
</script>

{% endblock %}
